<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA Commerce</title>

<style>
:root{
    --bg:#050816;
    --card:rgba(255,255,255,.05);
    --glass:rgba(255,255,255,.08);
    --text:#fff;
    --primary:#5B8CFF;
    --secondary:#8B5CF6;
    --success:#22C55E;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,system-ui,sans-serif;
}

html{
    scroll-behavior:smooth;
}

body{
    background:var(--bg);
    color:var(--text);
    overflow-x:hidden;
}

/* Background */

.bg{
    position:fixed;
    inset:0;
    z-index:-1;
}

.blob{
    position:absolute;
    border-radius:50%;
    filter:blur(120px);
    animation:float 15s infinite ease-in-out;
}

.blob:nth-child(1){
    width:400px;
    height:400px;
    background:#2563eb;
    left:-100px;
    top:50px;
}

.blob:nth-child(2){
    width:350px;
    height:350px;
    background:#7c3aed;
    right:-100px;
    top:200px;
}

@keyframes float{
    50%{
        transform:
        translateY(-50px)
        translateX(40px);
    }
}

/* Navbar */

nav{
    position:fixed;
    top:0;
    width:100%;
    backdrop-filter:blur(20px);
    background:rgba(5,8,22,.6);
    border-bottom:1px solid rgba(255,255,255,.08);
    z-index:1000;
}

.nav-container{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.logo{
    font-size:1.6rem;
    font-weight:800;
}

.logo span{
    color:var(--primary);
}

.links{
    display:flex;
    gap:25px;
}

.links a{
    color:white;
    text-decoration:none;
    opacity:.8;
    transition:.3s;
}

.links a:hover{
    opacity:1;
}

.cart-btn{
    border:none;
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color:white;
    padding:12px 20px;
    border-radius:12px;
    cursor:pointer;
}

/* Hero */

.hero{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:40px;
}

.hero-content{
    max-width:900px;
}

.badge{
    display:inline-block;
    padding:10px 18px;
    border-radius:999px;
    background:var(--glass);
    backdrop-filter:blur(10px);
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(3rem,8vw,6rem);
    line-height:1;
}

.gradient{
    background:linear-gradient(
        90deg,
        #60A5FA,
        #A855F7
    );
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    margin-top:25px;
    font-size:1.2rem;
    opacity:.8;
}

.hero-buttons{
    margin-top:35px;
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
}

.btn{
    padding:16px 30px;
    border:none;
    border-radius:14px;
    cursor:pointer;
    font-weight:700;
    transition:.3s;
}

.btn-primary{
    background:linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color:white;
}

.btn:hover{
    transform:translateY(-3px);
}

/* Products */

.products{
    max-width:1400px;
    margin:auto;
    padding:100px 25px;
}

.section-title{
    text-align:center;
    margin-bottom:60px;
    font-size:3rem;
}

.grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));
    gap:30px;
}

.card{
    background:var(--card);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    overflow:hidden;
    transition:.4s;
}

.card:hover{
    transform:
    translateY(-10px)
    scale(1.02);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.content{
    padding:25px;
}

.price{
    color:#60A5FA;
    font-size:1.4rem;
    margin:15px 0;
    font-weight:700;
}

.buy{
    width:100%;
    border:none;
    padding:14px;
    border-radius:12px;
    cursor:pointer;
    background:
    linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
    color:white;
}

/* Cart */

.cart{
    position:fixed;
    right:20px;
    top:90px;
    width:350px;
    max-height:80vh;
    overflow:auto;
    background:#0f172a;
    border-radius:20px;
    padding:20px;
    display:none;
}

.cart-item{
    margin:12px 0;
    display:flex;
    justify-content:space-between;
}

/* Reveal */

.reveal{
    opacity:0;
    transform:translateY(50px);
    transition:1s;
}

.reveal.active{
    opacity:1;
    transform:none;
}

footer{
    text-align:center;
    padding:60px 20px;
    opacity:.6;
}

/* Mobile */

@media(max-width:768px){

    .links{
        display:none;
    }

    .cart{
        width:92%;
        right:4%;
    }
}
</style>
</head>
<body>

<div class="bg">
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<nav>
<div class="nav-container">

<div class="logo">
NOVA<span>.</span>
</div>

<div class="links">
<a href="#">Home</a>
<a href="#">Produtos</a>
<a href="#">Contato</a>
</div>

<button class="cart-btn" onclick="toggleCart()">
🛒 <span id="count">0</span>
</button>

</div>
</nav>

<section class="hero">

<div class="hero-content">

<div class="badge">
✨ Plataforma Premium
</div>

<h1>
Tecnologia para o
<span class="gradient">futuro.</span>
</h1>

<p>
Experiência moderna, rápida e elegante.
</p>

<div class="hero-buttons">
<button class="btn btn-primary">
Explorar
</button>
</div>

</div>

</section>

<section class="products reveal">

<h2 class="section-title">
Produtos
</h2>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/600/400?1">
<div class="content">
<h3>Smartphone X</h3>
<div class="price">R$ 3.999</div>
<button class="buy"
onclick="add('Smartphone X',3999)">
Comprar
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?2">
<div class="content">
<h3>Notebook Pro</h3>
<div class="price">R$ 6.999</div>
<button class="buy"
onclick="add('Notebook Pro',6999)">
Comprar
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/400?3">
<div class="content">
<h3>Headset Elite</h3>
<div class="price">R$ 899</div>
<button class="buy"
onclick="add('Headset Elite',899)">
Comprar
</button>
</div>
</div>

</div>
</section>

<div class="cart" id="cart">
<h2>Carrinho</h2>
<div id="items"></div>
<h3>Total: R$ <span id="total">0</span></h3>
</div>

<footer>
© 2026 NOVA Commerce
</footer>

<script>
let cart =
JSON.parse(localStorage.getItem("cart")) || [];

function save(){
 localStorage.setItem(
 "cart",
 JSON.stringify(cart)
 );
}

function add(name,price){

 cart.push({name,price});

 render();
 save();
}

function render(){

 let html='';
 let total=0;

 cart.forEach(item=>{

 total += item.price;

 html += `
 <div class="cart-item">
 ${item.name}
 <span>R$ ${item.price}</span>
 </div>
 `;
 });

 document.getElementById("items").innerHTML=html;
 document.getElementById("total").innerHTML=
 total.toLocaleString();

 document.getElementById("count").innerHTML=
 cart.length;
}

render();

function toggleCart(){

 const c =
 document.getElementById("cart");

 c.style.display =
 c.style.display==="block"
 ? "none"
 : "block";
}

const observer =
new IntersectionObserver(entries=>{

 entries.forEach(entry=>{

 if(entry.isIntersecting){

 entry.target.classList.add("active");

 }

 });

});

document
.querySelectorAll(".reveal")
.forEach(el=>observer.observe(el));
</script>

</body>
</html>
